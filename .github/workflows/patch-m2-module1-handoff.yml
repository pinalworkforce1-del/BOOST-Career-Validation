name: Patch Module 1 to Module 2 handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-m2-module1-handoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Module 1 carry-forward reader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = "['c1','c2','c3','c4','c5'].forEach(setupOccupationSearch);"
          if 'function carryForwardFromModule1()' in s:
              print('Carry-forward reader already present; no patch needed.')
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('Could not find Module 2 occupation-search initialization marker.')
          patch = r'''

function carryForwardFromModule1(){
 const KEY='pinal_boost_career_exploration_v1',SCORE_KEY='pinal_boost_onet_scores_v1';
 let state=null;
 try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
 const saved=state?.module1?.selected||[];
 let carried=0,missing=0;
 saved.slice(0,3).forEach((savedCareer,i)=>{
   const id='c'+(i+1);
   if($(id).value.trim()||$(id+'soc').value)return;
   const match=DATA.find(x=>x.soc===savedCareer.soc);
   if(match){chooseOccupation(id,match.soc);carried++}else{missing++}
 });
 let carriedScores=state?.module1?.scores||null;
 if(!carriedScores){try{carriedScores=JSON.parse(localStorage.getItem(SCORE_KEY)||'null')}catch(_){}}
 if(carriedScores){
   ['R','I','A','S','E','C'].forEach(k=>{
     if($(k)&&!$(k).value&&Number.isFinite(Number(carriedScores[k])))$(k).value=carriedScores[k];
   });
 }
 if(saved.length){
   let note=$('module1CarryForwardStatus');
   if(!note){note=document.createElement('div');note.id='module1CarryForwardStatus';note.className='info';const panel=$('careerCarryForward'),sub=panel?.querySelector('.sub');if(panel)sub?.insertAdjacentElement('afterend',note)}
   if(note){
     if(carried){note.innerHTML='<b>'+carried+' career'+(carried===1?'':'s')+' carried forward from Discover.</b><br>Your O*NET scores were carried forward too. You can change a career or add optional careers before building your reality checks.'}
     else if(missing){note.innerHTML='<b>Your Discover selections were found.</b><br>One or more occupations need to be reselected from the Module 2 occupation list so BOOST can attach the correct evidence.'}
   }
 }
}
carryForwardFromModule1();
'''
          s = s.replace(marker, marker + patch, 1)
          p.write_text(s, encoding='utf-8')
          print('Patched index.html')
          PY
      - name: Commit handoff fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Carry Module 1 careers and O*NET scores into Module 2"
          git push
